<header class="header">
  <div class="container">
    <div class="topbar">
      <span class="topbar__location"><span class="topbar__dot" aria-hidden="true"></span>ŁÓDŹ · Z DOJAZDEM</span>
      <span class="topbar__note">Przykładowa strona</span>
    </div>

    <div class="header__inner">
      <a class="logo" href="#" aria-label="OD NOWA — na początek">
        <svg class="icon logo__icon" aria-hidden="true">
          <use href="./img/sprite.svg#icon-sofa"></use>
        </svg>
        <span class="logo__text">OD NOWA<small class="logo__caption">PRANIE KANAP</small></span>
      </a>

      <nav class="nav" aria-label="Menu główne">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="#usluga">Co robimy</a></li>
          <li class="nav__item"><a class="nav__link" href="#proces">Jak to działa</a></li>
          <li class="nav__item"><a class="nav__link" href="#pytania">Pytania</a></li>
        </ul>
      </nav>

      <a class="header__cta" href="#wycena">
        Poproś o wycenę
        <svg class="icon header__cta-icon" aria-hidden="true">
          <use href="./img/sprite.svg#icon-arrow"></use>
        </svg>
      </a>

      <button
        class="burger"
        type="button"
        aria-label="Otwórz menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        data-menu-open
      >
        <svg class="icon burger__icon" aria-hidden="true">
          <use href="./img/sprite.svg#icon-menu"></use>
        </svg>
      </button>
    </div>
  </div>
</header>
